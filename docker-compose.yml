services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oriel
      POSTGRES_PASSWORD: oriel_dev_password
      POSTGRES_DB: oriel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oriel -d oriel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oriel
      MINIO_ROOT_PASSWORD: oriel_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 4
        mc alias set local http://minio:9000 oriel oriel_dev_password
        mc mb -p local/oriel || true
        mc anonymous set download local/oriel || true

  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    ports:
      - "3310:3310"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://oriel:oriel_dev_password@postgres:5432/oriel
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed && pnpm start"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://oriel:oriel_dev_password@postgres:5432/oriel
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    command: ["pnpm", "worker"]

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://oriel:oriel_dev_password@postgres:5432/oriel
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      SANDBOX_PORT: "3001"
      APP_URL: http://localhost:3000
    ports:
      - "3001:3001"
    command: ["pnpm", "sandbox"]

volumes:
  postgres_data:
  minio_data:
